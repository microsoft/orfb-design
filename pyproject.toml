[project]
name = "orfb-design"
version = "0.1.0"
description = "Agora Workbench MCP server for organic redox-flow-battery (ORFB) molecule design."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agora-workbench[azure,catalog-vector]==0.3.1",
    "fastmcp==3.4.10",
]

[project.optional-dependencies]
# Tools needed to run the RDKit-native tool implementations and tests outside
# the conda execution kernel (the kernel itself provides RDKit via conda).
test = [
    "pytest>=8.0",
    "rdkit>=2024.3.1",
    # The staged EZBattery stack is pure Python, so its tests run real
    # simulations once scripts/fetch_ezbattery_source.sh supplies the pinned
    # upstream modules. numpy is pinned <2 to match its conda kernel.
    "numpy<2",
    # EZBattery is not compatible with the NumPy-2-only SciPy releases.
    "scipy<1.15",
    "pandas",
    "openpyxl",
    "ismember",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["servers*"]
exclude = ["servers.*.*_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
