[project]
name = "ezbattery-tools"
version = "0.1.0"
description = "In-kernel EZBattery cell-level RFB simulation tools for the ezbattery MCP server."
requires-python = ">=3.9"
# The numeric stack (numpy, scipy, pandas, openpyxl, ismember) is provided by the
# conda execution environment; this package itself declares no runtime
# dependencies so it stays importable during server setup without them.
# scripts/fetch_ezbattery_source.sh stages the pinned upstream EZBattery modules
# under _vendor/EZBattery because upstream ships no installable Python package.
dependencies = []

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ezbattery_tools.data" = ["*.json"]
"ezbattery_tools._vendor.EZBattery" = ["LICENSE", "UPSTREAM_COMMIT"]
