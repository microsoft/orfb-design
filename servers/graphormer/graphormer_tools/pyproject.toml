[project]
name = "graphormer-tools"
version = "0.1.0"
description = "In-kernel Graphormer redox potential prediction tools for the graphormer MCP server."
requires-python = ">=3.9"
# The heavy inference stack (torch, fairseq, graphormer, ogb, torch-geometric)
# is provided by the conda execution environment; this package itself declares
# no runtime dependencies so it stays importable during server setup without
# them (real inference requires that stack plus the model checkpoints).
dependencies = []

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
