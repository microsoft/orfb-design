# Graphormer Redox MCP Server — local development
#
# Build the agora-workbench base image first (see Dockerfile header), then:
#   mkdir -p published_artifacts && chmod 1777 published_artifacts
#   docker compose up --build

services:
  graphormer-server:
    build:
      context: ../..
      dockerfile: servers/graphormer/Dockerfile
    ports:
      - "127.0.0.1:8041:8000"
    volumes:
      - ./published_artifacts:/tmp/published_artifacts
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      AGORA_ALLOW_UNAUTHENTICATED_REMOTE: "1"
      PUBLISH_DIR: "/tmp/published_artifacts"
      SERVER_PUBLIC_URL: "http://localhost:8041"
      GRAPHORMER_CHECKPOINT_DIR: "${GRAPHORMER_CHECKPOINT_DIR:-/app/checkpoints}"
      GRAPHORMER_DEVICE: "${GRAPHORMER_DEVICE:-cpu}"
      AGORA_PEER_REGISTRY: '{"orfb":"http://orfb-server:8000","graphormer":"http://graphormer-server:8000","retrochimera":"http://retrochimera-server:8000"}'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
