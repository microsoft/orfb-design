      - wheel==0.43.0
      - Cython==0.29.36
      - numpy==1.22.3
      - scipy==1.11.4
      - cffi==1.16.0
      - hydra-core==1.0.7
      - omegaconf==2.0.6
      - regex==2024.5.15
      - sacrebleu==2.4.2
      - tqdm==4.66.4
      - bitarray==2.9.2
      - torchaudio==0.9.1
      - lmdb==1.4.1
      - googledrivedownloader==0.4
      - ogb==1.3.2
      - protobuf==4.25.3
      - rdkit-pypi==2021.9.3
      - torch-geometric==1.7.2
      - https://data.dgl.ai/wheels/dgl-0.7.2-cp39-cp39-manylinux1_x86_64.whl
