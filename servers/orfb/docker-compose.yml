# ORFB Design MCP Server (RDKit characterization) — local development
#
# Build the agora-workbench base image first (see Dockerfile header), then:
#   mkdir -p published_artifacts && chmod 1777 published_artifacts
#   docker compose up --build
#
# For the full network (orfb + graphormer + retrochimera + hub), use the
# docker-compose.yml at the repository root instead.

services:
  orfb-server:
    build:
      context: ../..
      dockerfile: servers/orfb/Dockerfile
    ports:
      - "127.0.0.1:8040:8000"
    volumes:
      - ./published_artifacts:/tmp/published_artifacts
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      AGORA_ALLOW_UNAUTHENTICATED_REMOTE: "1"
      PUBLISH_DIR: "/tmp/published_artifacts"
      SERVER_PUBLIC_URL: "http://localhost:8040"
      # Optional artifact publishing to Azure Blob (set account URL to enable).
      BLOB_PUBLISH_ACCOUNT_URL: "${BLOB_PUBLISH_ACCOUNT_URL:-}"
      BLOB_PUBLISH_CONTAINER: "${BLOB_PUBLISH_CONTAINER:-artifacts}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
